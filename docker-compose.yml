version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zorvak-sentinel-api:latest
    env_file:
      - .env
    restart: always
    networks:
      - internal_network
    # Not mapping port 8000 to the host so it is only accessible via nginx

  nginx:
    image: nginx:1.25-alpine
    container_name: sentinel_nginx
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL is configured
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
