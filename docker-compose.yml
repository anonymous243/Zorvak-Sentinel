services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zorvak-sentinel-api:latest
    env_file:
      - .env
    restart: always
    networks:
      - internal_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.frontend
    image: zorvak-sentinel-frontend:latest
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: always
    networks:
      - internal_network

  nginx:
    image: nginx:1.25-alpine
    container_name: sentinel_nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
